name: Build

# Windows-only repo: typechecks the island, runs the Rust tests and verifies
# the release relay builds (the Tauri build script bundles it as a resource).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install dependencies
        run: npm ci

      # This is the step the rest of the job depends on, and both of its halves
      # are load-bearing. Its prebuild makes target/release/coucou-hook.exe,
      # which tauri.conf.json lists under bundle.resources; vite build produces
      # dist/, which frontendDist points at. cargo test will not compile the
      # crate without either one, and it fails with a message that names neither
      # ("resource path ... doesn't exist", "frontendDist ... doesn't exist")
      # because both are validated by build scripts rather than by rustc.
      #
      # It also runs `tsc --noEmit` itself, so a separate typecheck step would
      # only repeat it.
      - name: Build the front end and the agent relay
        run: npm run build

      - name: Rust tests
        run: cargo test --workspace
