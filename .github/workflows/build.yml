name: Build

# Windows-only repo: typechecks the island, runs the Rust tests and verifies
# the release relay builds (the Tauri build script bundles it as a resource).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Typecheck the island
        run: npx tsc --noEmit

      # tauri-build validates `bundle.resources` while the crate compiles, and
      # fails the build script when a listed path is missing. coucou-hook.exe is
      # one of them, and `cargo test` never produces it: cargo builds a test
      # binary, not the exe. `npm run pack` gets this for free from the prebuild
      # script, which is why it only ever broke here and never on a machine.
      - name: Build the agent relay
        run: cargo build --release -p coucou-hook

      - name: Rust tests
        run: cargo test --workspace
